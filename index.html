<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOT×MUSIC</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--b1:#ffd0e6;--b2:#cde6ff;--b3:#fff0b3;--fg:#3a2f4a;--sub:#8a7d99;--card:rgba(255,255,255,.72);--line:rgba(80,60,110,.14);--g1:#ff6fa5;--g2:#ff9a5c;--g3:#6a8dff;--cv:#fffdf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151f;--b1:#4a2250;--b2:#1c3a5e;--b3:#3c3a1a;--fg:#f4eefc;--sub:#a79bb8;--card:rgba(44,40,60,.72);--line:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#17151f;--b1:#4a2250;--b2:#1c3a5e;--b3:#3c3a1a;--fg:#f4eefc;--sub:#a79bb8;--card:rgba(44,40,60,.72);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
background:radial-gradient(circle at 8% 8%,var(--b1),transparent 42%),radial-gradient(circle at 92% 18%,var(--b2),transparent 42%),radial-gradient(circle at 50% 100%,var(--b3),transparent 48%),var(--bg);
display:flex;flex-direction:column;align-items:center;padding:18px 14px 30px;gap:14px}
h1{font-family:"DotGothic16","Zen Maru Gothic",monospace;font-size:clamp(1.7rem,7vw,2.4rem);margin:0;text-align:center;
background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin:0;color:var(--sub);font-size:.9rem;font-weight:700;text-align:center}
.panel{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;padding:12px;box-shadow:0 10px 30px rgba(120,80,160,.15);width:min(94vw,520px)}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:16px;background:var(--cv);box-shadow:inset 0 0 0 1px var(--line);touch-action:manipulation}
button{font:inherit;font-weight:900;font-size:1.15rem;border:0;border-radius:999px;padding:16px;width:min(94vw,520px);cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 6px 16px rgba(255,111,165,.45)}
button:active{transform:scale(.97)}
.row{display:flex;gap:10px;width:min(94vw,520px)}.row #play{flex:1;width:auto}
.ic{width:58px!important;padding:0!important;background:var(--card)!important;color:var(--fg)!important;box-shadow:none!important;border:2px solid var(--line)!important;opacity:.55;font-size:1.3rem!important}
.ic.on{opacity:1;background:linear-gradient(135deg,var(--g3),#8a5cff)!important;color:#fff!important;border-color:transparent!important}
#empty{display:none;text-align:center;line-height:1.8;padding:30px 10px;font-weight:700}
#msg{font-size:.85rem;color:var(--sub);font-weight:700;text-align:center;min-height:1.2em}
</style></head><body>
<h1>♪ DOT×MUSIC</h1>
<p class="sub" id="info">あなたがつくった えと きょく</p>
<div class="panel" id="art"><canvas id="c" width="640" height="640"></canvas></div>
<div class="row"><button id="loop" class="ic on" title="くりかえし" aria-label="くりかえし">🔁</button><button id="play">▶ きょくをきく</button></div>
<div id="msg"></div>
<div class="panel" id="empty">QRコードをよみとると、<br>ここに えと きょくが ひょうじされます。</div>
<script>
const N=64,H=12,SR=44100,$=id=>document.getElementById(id);
const COL=[null,'#ff3b30','#ffbfcc','#ffff00','#80ccff','#007aff','#34c759','#ccb3e6','#ff9900','#fae0c7','#cc8033','#8e8e93','#000000','#ff66c4','#16c7a8','#8a5cff'];
const TIMBRE=[null,['square',0],['triangle',12],['triangle',12],['sine',12],['square',0],['sine',0],['sawtooth',0],['triangle',0],['sine',0],['triangle',-12],['sine',-12],['sawtooth',-12]];
const STY=[
 {n:'🎹 ポップ',sc:[0,2,4,5,7,9,11],mul:1,inst:'epiano',oct:0,hop:2,len:3,ex:[],dr:1,ec:0,ef:0},
 {n:'🎸 ロック',sc:[0,3,5,7,10],mul:1.1,inst:'guitar',oct:-12,hop:2,len:2.5,ex:[7],dr:2,ec:3,ef:.25},
 {n:'🎍 和風',sc:[0,1,5,7,8],mul:.8,inst:'koto',oct:0,hop:2,len:8,ex:[],dr:3,ec:4,ef:.35},
 {n:'👾 8bit',sc:[0,2,4,7,9],mul:1.3,inst:'chip',oct:12,hop:1,len:1.5,ex:[],dr:4,ec:0,ef:0},
 {n:'🌙 しっとり',sc:[0,2,3,5,7,8,10],mul:.7,inst:'pad',oct:0,hop:4,len:7,ex:[7],dr:0,ec:6,ef:.5},
 {n:'🎠 オルゴール',sc:[0,2,4,5,7,9,11],mul:.85,inst:'musicbox',oct:0,hop:2,len:6,ex:[],dr:0,ec:4,ef:.3}];
const BR={sine:.3,triangle:.5,square:.7,sawtooth:1};
const BPM=[90,120,160];
let grid=new Uint8Array(N*N),sty=0,tp=1,playing=false,playCol=-1;
const ctx=$('c').getContext('2d');

function decode(s){
  const b=Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const g=new Uint8Array(N*N);
  if(b[0]===0){for(let i=0;i<N*N;i++){const v=b[H+(i>>1)];g[i]=(i&1)?v&15:v>>4;}}
  else{let p=H,i=0;while(p<b.length&&i<N*N){const v=(b[p]<<8)|b[p+1];p+=2;const run=(v&4095)+1;g.fill(v>>12,i,i+run);i+=run;}}
  for(let k=0;k<3;k++)COL[13+k]='#'+[0,1,2].map(m=>b[3+k*3+m].toString(16).padStart(2,'0')).join('');
  grid=g;sty=Math.min(STY.length-1,b[1]);tp=Math.min(2,b[2]);
}
function render(){
  const S=10;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--cv').trim();ctx.fillRect(0,0,640,640);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=grid[y*N+x];if(v&&COL[v]){ctx.fillStyle=COL[v];ctx.fillRect(x*S,y*S,S+.4,S+.4);}}
  if(playCol>=0){const g=ctx.createLinearGradient(0,0,0,640);g.addColorStop(0,'rgba(255,111,165,.45)');g.addColorStop(1,'rgba(106,141,255,.45)');ctx.fillStyle=g;ctx.fillRect(playCol*S,0,S,640);
    {const hb=STY[sty].hop;ctx.beginPath();let f=true;
      for(let c=0;c<=playCol;c+=hb*2){const r=bassRow(c);if(r===null)continue;const px=(c+hb/2)*S,py=(r+.5)*S;if(f){ctx.moveTo(px,py);f=false;}else ctx.lineTo(px,py);}
      ctx.lineJoin=ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#00ecd5';ctx.lineWidth=3;ctx.stroke();
      const rb=bassRow(playCol);if(rb!==null){ctx.beginPath();ctx.arc((playCol+.5)*S,(rb+.5)*S,S*1.1,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#00ecd5';ctx.stroke();}}
    const h=STY[sty].hop;ctx.beginPath();let first=true;
    for(let c=0;c<=playCol;c+=h){const r=leadRow(c);if(r===null)continue;const px=(c+h/2)*S,py=(r+.5)*S;if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}
    ctx.lineJoin=ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#ff4f93';ctx.lineWidth=2.5;ctx.stroke();
    const r=leadRow(playCol);if(r!==null){ctx.beginPath();ctx.arc((playCol+.5)*S,(r+.5)*S,S*1.3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ff4f93';ctx.stroke();}}
}
function hsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0;
  if(mx!==mn){const d=mx-mn;h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return[h,l];}
function timbre(v){if(v<=12)return TIMBRE[v];const[h,l]=hsl(COL[v]);return[['sine','triangle','square','sawtooth'][Math.floor(h/90)%4],l>.65?12:l<.35?-12:0];}
// ---- 絵 → 音 ----
// リード＝絵の輪郭（各列でいちばん上のドット）、ハーモニー＝使った色、ベース＝絵の底、
// 音量＝絵の濃さ、空白の列＝休符、キー＝いちばん多く使った色
function leadRow(col){const h=STY[sty].hop,x=Math.floor(col/h)*h,t=[];
  for(let xx=x;xx<Math.min(N,x+h);xx++)for(let y=0;y<N;y++)if(grid[y*N+xx]){t.push(y);break;}
  return t.length?t.reduce((a,b)=>a+b)/t.length:null;}
function bassRow(col){const h=STY[sty].hop;let x=Math.floor(col/h)*h;if((x/h)%2)x-=h;const t=[];
  for(let xx=x;xx<Math.min(N,x+h);xx++)for(let y=N-1;y>=0;y--)if(grid[y*N+xx]){t.push(y);break;}
  return t.length?t.reduce((a,b)=>a+b)/t.length:null;}
function dominantRoot(){const c=new Array(16).fill(0);for(const v of grid)if(v)c[v]++;let m=0,b=0;for(let i=1;i<16;i++)if(c[i]>0&&c[i]>=b){m=i;b=c[i];}return m?(m-1)%12:0;}
function midiOf(row,st,root){const s=st.sc,n=s.length*3,i=Math.min(n-1,Math.max(0,Math.floor((N-1-row)/N*n)));return 48+root+12*Math.floor(i/s.length)+s[i%s.length]+st.oct;}
function groupNotes(x,h,root){
  const st=STY[sty],tops=[],bots=[],topC={},cnt={},sum={};let ink=0;
  for(let xx=x;xx<Math.min(N,x+h);xx++){let top=-1,bot=-1;
    for(let y=0;y<N;y++){const v=grid[y*N+xx];if(v){if(top<0){top=y;topC[v]=(topC[v]||0)+1;}bot=y;ink++;cnt[v]=(cnt[v]||0)+1;sum[v]=(sum[v]||0)+y;}}
    if(top>=0){tops.push(top);bots.push(bot);}}
  if(!tops.length)return[];
  const avg=a=>a.reduce((p,q)=>p+q,0)/a.length,vol=.5+.5*Math.min(1,ink/(h*24)),out=[];
  const lc=+Object.keys(topC).sort((a,b)=>topC[b]-topC[a]||a-b)[0];
  out.push({midi:Math.max(36,midiOf(avg(tops),st,root)),br:BR[timbre(lc)[0]],g:vol});
  Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a-b).slice(0,2).forEach(v=>{const t=timbre(+v);
    out.push({midi:Math.max(36,midiOf(sum[v]/cnt[v],st,root)+t[1]),br:BR[t[0]],g:.45*vol});});
  if((x/h)%2===0)out.push({midi:Math.max(36,midiOf(avg(bots),st,root)-12),br:.4,g:.65*vol});
  return out;
}
const TP=2*Math.PI,saw=p=>2*(p-Math.floor(p))-1,tri=p=>4*Math.abs(p-Math.floor(p)-.5)-1;
// 楽器：f=周波数, br=明るさ(色で変わる), dur=音の長さ(秒)
function voice(inst,f,br,dur){
  if(inst==='epiano')return t=>{ // エレピ（FM合成）
    const idx=(1+2.5*br)*Math.exp(-5*t/dur),e=Math.min(t/.004,1)*Math.exp(-3.2*t/dur);
    return .16*e*(Math.sin(TP*f*t+idx*Math.sin(TP*f*t))+.25*Math.sin(TP*f*14*t)*Math.exp(-30*t));};
  if(inst==='guitar'){let lp=0;const a=1-Math.exp(-TP*(700+3500*br)/SR);return t=>{ // 歪んだギター
    const x=.5*(saw(f*t)+saw(f*1.006*t));lp+=a*(x-lp);
    return .2*Math.min(t/.003,1)*Math.exp(-2.5*t/dur)*Math.tanh(5*lp);};}
  if(inst==='koto'){const n=Math.max(2,Math.round(SR/f)),b=new Float32Array(n);let i=0;const d=.994+.005*br; // 琴（弦のシミュレーション）
    for(let k=0;k<n;k++)b[k]=Math.random()*2-1;
    return()=>{const y=b[i];b[i]=d*.5*(y+b[(i+1)%n]);i=(i+1)%n;return .22*y;};}
  if(inst==='chip'){const duty=.5-.375*br;return t=>{ // ファミコン（パルス波）
    const p=f*t,ph=p-Math.floor(p),e=Math.floor(Math.exp(-4*t/dur)*6)/6;return .1*e*(ph<duty?1:-1);};}
  if(inst==='pad')return t=>{ // ふわっとしたストリングス
    const vib=.06*Math.sin(TP*5*t);let s=0;
    for(let k=0;k<2;k++){const p=f*(1+.006*(k-.5))*t+vib;s+=.6*Math.sin(TP*p)+.4*tri(p)+br*.25*Math.sin(TP*2*p);}
    return .1*Math.min(t/.15,1)*Math.exp(-1.3*t/dur)*s;};
  const R=[1,2.76,5.4,8.93],A=[1,.35,.18,.08],D=[3,7,13,24]; // オルゴール（金属の櫛の響き）
  return t=>{let v=0;for(let k=0;k<4;k++){if(f*R[k]>9000)continue;v+=A[k]*(k?.5+br:1)*Math.exp(-D[k]*t/dur)*Math.sin(TP*f*R[k]*t);}
    return .14*Math.min(t/.002,1)*v;};
}
function hits(k,p){const r=[];
  if(k===1){if(p===0||p===8)r.push(0);if(p===4||p===12)r.push(1);if(p%2===0)r.push(2);}
  else if(k===2){if(p===0||p===8||p===10)r.push(0);if(p===4||p===12)r.push(1);if(p%2===0)r.push(2);}
  else if(k===3){if(p===0||p===8)r.push(3);}
  else if(k===4){if(p===4||p===12)r.push(1);if(p%4===2)r.push(2);}
  else if(k===5){if(p%4===0)r.push(0);if(p===4||p===12)r.push(1);if(p%4===2)r.push(2);}
  return r;}
function renderSong(){
  const st=STY[sty],step=60/(BPM[tp]*st.mul)/4,noteLen=step*st.len,total=(N+st.len+3+st.ec*4)*step+.3,frames=Math.floor(total*SR),s=new Float32Array(frames);
  const mix=(start,len,fn)=>{for(let i=0;i<len;i++){const idx=start+i;if(idx>=frames)break;s[idx]+=fn(i/SR);}};
  const drum=(k,start)=>{let ph=0,prev=0;
    if(k===0)mix(start,.2*SR|0,t=>{ph+=TP*(50+110*Math.exp(-t*28))/SR;return .55*Math.exp(-t*16)*Math.sin(ph);});
    else if(k===1)mix(start,.14*SR|0,t=>Math.exp(-t*24)*(.22*(Math.random()*2-1)+.18*Math.sin(TP*190*t)));
    else if(k===2)mix(start,.05*SR|0,t=>{const nz=Math.random()*2-1,r=.09*Math.exp(-t*80)*(nz-prev);prev=nz;return r;});
    else mix(start,.45*SR|0,t=>{ph+=TP*(62+60*Math.exp(-t*14))/SR;return .6*Math.exp(-t*7)*Math.sin(ph);});};
  const len=Math.floor(noteLen*SR),root=dominantRoot();
  for(let x=0;x<N;x+=st.hop){
    const start=Math.floor(x*step*SR);
    groupNotes(x,st.hop,root).forEach(nt=>[0,...st.ex].forEach((off,k)=>{
      const f=440*Math.pow(2,(nt.midi+off-69)/12),v=voice(st.inst,f,nt.br,noteLen),g=nt.g*(k===0?1:.6);
      mix(start,len,t=>g*v(t)*Math.min(1,(noteLen-t)/.02));}));
  }
  for(let x=0;x<N;x++)hits(st.dr,x%16).forEach(h=>drum(h,Math.floor(x*step*SR)));
  if(st.ec>0){const d=Math.floor(st.ec*step*SR);for(let i=d;i<frames;i++)s[i]+=st.ef*s[i-d];}
  let e=0;for(let i=0;i<frames;i++)e+=s[i]*s[i];
  const gain=Math.min(5,.17/Math.max(Math.sqrt(e/frames),1e-6));
  for(let i=0;i<frames;i++)s[i]=Math.tanh(s[i]*gain);
  return{s,total,step};
}
let ac=null,song=null,wbuf=null,pbuf=null,cur=null,t0=0,loopOn=true;
const mk=a=>{const b=ac.createBuffer(1,a.length,SR);b.copyToChannel(a,0);return b;};
// いまの位置(offsetSec)から流す。fade=true のときは前の音とクロスフェード
function startSrc(offsetSec,fade){
  const g=ac.createGain(),src=ac.createBufferSource(),now=ac.currentTime;
  src.buffer=loopOn?wbuf:pbuf;src.loop=loopOn;src.connect(g);g.connect(ac.destination);
  if(fade){g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(1,now+.06);}
  src.start(now+.02,offsetSec);t0=now+.02-offsetSec;
  const old=cur;cur={src,g};
  if(old){old.g.gain.cancelScheduledValues(now);old.g.gain.setValueAtTime(old.g.gain.value,now);old.g.gain.linearRampToValueAtTime(0,now+.06);old.src.stop(now+.08);}
}
function stopAll(){
  playing=false;playCol=-1;
  if(cur&&ac){const n=ac.currentTime;cur.g.gain.cancelScheduledValues(n);cur.g.gain.setValueAtTime(cur.g.gain.value,n);cur.g.gain.linearRampToValueAtTime(0,n+.1);cur.src.stop(n+.12);}
  cur=null;render();$('play').textContent='▶ きょくをきく';
}
function play(){
  if(playing){stopAll();return;}
  playing=true;$('play').textContent='♪ つくっています…';
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  setTimeout(go,40);
}
function go(){
  if(!playing)return;
  song=renderSong();
  const L=Math.floor(N*song.step*SR),w=song.s.slice(0,L);
  for(let i=L;i<song.s.length;i++)if(i-L<L)w[i-L]+=song.s[i];   // 余韻を頭に重ねて、つなぎ目のないループにする
  pbuf=mk(song.s);wbuf=mk(w);song.Lsec=L/SR;
  startSrc(0,false);
  $('play').textContent='■ とめる';
  (function loop(){
    if(!playing)return;
    const e=ac.currentTime-t0;
    if(loopOn){playCol=Math.min(N-1,Math.floor((e%song.Lsec)/song.step));}
    else{if(e>song.total){stopAll();return;}const c=Math.floor(e/song.step);playCol=c>=0&&c<N?c:-1;}
    render();requestAnimationFrame(loop);})();
}
$('loop').onclick=()=>{
  loopOn=!loopOn;$('loop').classList.toggle('on',loopOn);
  if(playing&&cur&&song){const pos=((ac.currentTime-t0)%song.Lsec+song.Lsec)%song.Lsec;startSrc(pos,true);}
};
$('play').onclick=play;
let ok=false;
try{const h=location.hash.match(/d=([\w-]+)/);if(h){decode(h[1]);ok=grid.some(v=>v);}}catch(e){}
if(ok){render();$('info').textContent='きょくちょう：'+STY[sty].n;}
else{$('art').style.display='none';$('play').parentNode.style.display='none';$('info').style.display='none';$('empty').style.display='block';}
</script></body></html>
