<style>
:root{--ink:#5c2b33;--sub:#9a5a72;--pink:#ff78b0;--sky:#4dd9ed;--yellow:#ffe04d;--mint:#80e699;--cv:#fffdf8;--stick:#C19A6B;--f:.55;--S:calc(190px*var(--f));--D:clamp(212px,54.5vw,289px);--Wc:min(calc(94vw - 26px),494px,max(160px,calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 246px - var(--S)*1.59)));--PW:calc(var(--Wc) + 26px)}
@supports(height:100dvh){:root{--Wc:min(calc(94vw - 26px),494px,max(160px,calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 246px - var(--S)*1.59)))}}
*{box-sizing:border-box}
html{min-height:100%;background:var(--g3,#fff2b3)}
body{margin:0;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;overflow-x:hidden;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect x='16.0' y='27.5' width='16' height='5' rx='2.5' transform='rotate(30 24 30)' fill='%23ffffff' fill-opacity='0.9'/><rect x='91.0' y='15.5' width='14' height='5' rx='2.5' transform='rotate(-40 98 18)' fill='%234dd9ed' fill-opacity='0.9'/><rect x='151.0' y='41.5' width='18' height='5' rx='2.5' transform='rotate(70 160 44)' fill='%23ffe04d' fill-opacity='0.9'/><rect x='52.5' y='83.5' width='15' height='5' rx='2.5' transform='rotate(-20 60 86)' fill='%2380e699' fill-opacity='0.9'/><rect x='123.5' y='97.5' width='17' height='5' rx='2.5' transform='rotate(50 132 100)' fill='%23ff9e47' fill-opacity='0.9'/><rect x='13.0' y='131.5' width='14' height='5' rx='2.5' transform='rotate(-60 20 134)' fill='%23ffffff' fill-opacity='0.9'/><rect x='79.0' y='147.5' width='18' height='5' rx='2.5' transform='rotate(15 88 150)' fill='%23ffe04d' fill-opacity='0.9'/><rect x='162.5' y='157.5' width='15' height='5' rx='2.5' transform='rotate(-35 170 160)' fill='%234dd9ed' fill-opacity='0.9'/><rect x='42.0' y='179.5' width='16' height='5' rx='2.5' transform='rotate(60 50 182)' fill='%2380e699' fill-opacity='0.9'/><rect x='117.0' y='183.5' width='14' height='5' rx='2.5' transform='rotate(-10 124 186)' fill='%23ffffff' fill-opacity='0.9'/><rect x='180.0' y='103.5' width='12' height='5' rx='2.5' transform='rotate(20 186 106)' fill='%23ffe04d' fill-opacity='0.9'/></svg>") 0 0/200px 200px,linear-gradient(180deg,var(--g1,#ffe3f1) 0%,var(--g2,#ffeede) 55%,var(--g3,#fff2b3) 100%);
min-height:100vh;min-height:100dvh;
display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 52px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);gap:10px;justify-content:space-evenly}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(var(--D)*.353 + env(safe-area-inset-top,0px) + 4px);z-index:5;pointer-events:none;background:var(--drip,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='60'><rect x='0' y='-10' width='22' height='29' rx='11.0' fill='%23ff78b0'/><rect x='18' y='-10' width='18' height='21' rx='9.0' fill='%23ff78b0'/><rect x='40' y='-10' width='24' height='43' rx='12.0' fill='%23ff78b0'/><rect x='66' y='-10' width='16' height='23' rx='8.0' fill='%23ff78b0'/><rect x='86' y='-10' width='22' height='35' rx='11.0' fill='%23ff78b0'/><rect x='112' y='-10' width='18' height='19' rx='9.0' fill='%23ff78b0'/><rect x='130' y='-10' width='24' height='39' rx='12.0' fill='%23ff78b0'/><rect x='154' y='-10' width='16' height='25' rx='8.0' fill='%23ff78b0'/><rect x='0' y='-10' width='22' height='26' rx='11.0' fill='%23ffffff'/><rect x='18' y='-10' width='18' height='18' rx='9.0' fill='%23ffffff'/><rect x='40' y='-10' width='24' height='40' rx='12.0' fill='%23ffffff'/><rect x='66' y='-10' width='16' height='20' rx='8.0' fill='%23ffffff'/><rect x='86' y='-10' width='22' height='32' rx='11.0' fill='%23ffffff'/><rect x='112' y='-10' width='18' height='16' rx='9.0' fill='%23ffffff'/><rect x='130' y='-10' width='24' height='36' rx='12.0' fill='%23ffffff'/><rect x='154' y='-10' width='16' height='22' rx='8.0' fill='%23ffffff'/></svg>")) repeat-x 0 env(safe-area-inset-top,0px)/var(--D) auto,linear-gradient(#fff,#fff) 0 0/100% calc(env(safe-area-inset-top,0px) + 1px) no-repeat,linear-gradient(var(--dc,var(--pink)),var(--dc,var(--pink))) 0 0/100% calc(env(safe-area-inset-top,0px) + 4px) no-repeat}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.pop{display:flex;flex-direction:column;align-items:center;transform:rotate(-5deg);transform-origin:50% 100%;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}   /* 支点は棒の下（アプリと同じ） */
.head{position:relative;width:var(--S);height:var(--S);border-radius:50%;overflow:hidden;border:calc(var(--S)*.035) solid var(--ink);box-shadow:0 calc(var(--S)*.045) 0 var(--ink);z-index:1;background:#fff}
.swirl{position:absolute;inset:0;background:repeating-conic-gradient(from 90deg,var(--pink) 0 22.5deg,#fff 22.5deg 45deg,var(--sky) 45deg 67.5deg,#fff 67.5deg 90deg);animation:spin 14s linear infinite}
.disc{position:absolute;left:50%;top:50%;width:calc(var(--S)*.72);height:calc(var(--S)*.72);transform:translate(-50%,-50%);background:#fff;border:calc(var(--S)*.02) solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--S)*.27);font-weight:900;line-height:1;color:var(--ink)}
.head::after{content:"";position:absolute;width:calc(var(--S)*.2);height:calc(var(--S)*.07);left:calc(50% - var(--S)*.375);top:calc(50% - var(--S)*.366);border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-40deg)}
.pop{--sl:max(2px,calc(var(--S)*.025));--bl:max(1.5px,calc(var(--S)*.02))}   /* 棒の線・リボンの線の太さ(アプリと同じ) */
.stick{position:relative;width:calc(var(--S)*.09 + var(--sl));height:calc(var(--S)*.5 + var(--sl));margin-top:calc(var(--S)*-.1 - var(--sl)/2);background:var(--stick);border:var(--sl) solid var(--ink);border-radius:calc(var(--S)*.05 + var(--sl)/2)}
.bow{position:absolute;left:50%;top:calc(var(--S)*.11 - var(--sl)/2);width:0;height:0}
.bow i{position:absolute;top:calc(-1*(var(--S)*.05 + var(--bl)/2));width:calc(var(--S)*.2 + var(--bl));height:calc(var(--S)*.1 + var(--bl));background:var(--yellow);border:var(--bl) solid var(--ink);border-radius:999px}
.bow i:nth-child(1){left:calc(-1*(var(--S)*.2 + var(--bl)/2));transform:rotate(-22deg)}.bow i:nth-child(2){left:calc(-1*var(--bl)/2);transform:rotate(22deg)}
.bow b{position:absolute;left:calc(-1*(var(--S)*.045 + var(--bl)/2));top:calc(-1*(var(--S)*.045 + var(--bl)/2));width:calc(var(--S)*.09 + var(--bl));height:calc(var(--S)*.09 + var(--bl));background:var(--pink);border:var(--bl) solid var(--ink);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.ongaku{white-space:nowrap;font-weight:900;font-size:calc(var(--S)*.158);letter-spacing:.18em;padding-left:.18em;color:var(--ink);text-shadow:0 .07em 0 rgba(255,255,255,.9)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--DB:calc(var(--D)*.353 + env(safe-area-inset-top,0px) + 4px)}   /* --DB = 上のモコモコの下端 */
.deco svg{position:absolute;height:auto;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body>*{position:relative;z-index:1;pointer-events:none}   /* 画面いっぱいの透明な枠が、うしろのお菓子へのタップをふさがないように、枠はタップを通す */
.panel,.row,button{pointer-events:auto}                   /* さわる必要のある所（ボタン・絵のカード）だけ、タップを受ける */
.deco{position:fixed}
/* 上のモコモコの帯：さわると、あわが出る（ボタンや絵のカードより下に置くので、それらのタップはじゃましない） */
#bband{position:fixed;left:0;right:0;top:0;height:calc(var(--D)*.353 + env(safe-area-inset-top,0px) + 4px);z-index:0;pointer-events:auto;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#bcv{position:fixed;left:0;top:0;z-index:6;pointer-events:none;width:auto;aspect-ratio:auto;background:transparent;border-radius:0;box-shadow:none}
p.sub{margin:0;color:var(--sub);font-size:.95rem;font-weight:900;text-align:center}
p.sub .si{height:1.3em;width:1.3em;vertical-align:-.3em;margin:0 .15em}
.panel{background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:26px;padding:10px;width:var(--PW)}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:16px;background:var(--cv);box-shadow:inset 0 0 0 2px rgba(92,43,51,.14);touch-action:manipulation}
button{font:inherit;font-weight:900;font-size:1.1rem;letter-spacing:.06em;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 55%),var(--yellow);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:999px;padding:15px;width:var(--PW);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:12px;width:var(--PW)}.row #play{flex:1;width:auto}
.ic{width:58px!important;padding:0!important;background:#fff!important;font-size:1.3rem!important;letter-spacing:0!important;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ic svg{display:block;width:1.5rem;height:1.5rem;opacity:.45}.ic.on svg{opacity:1}   /* アプリと同じ：オフのときは、ボタンはそのままで、くり返しのマークだけうすくする */
.ic.on{opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 55%),var(--mint)!important}
#empty{display:none;text-align:center;line-height:1.9;padding:30px 10px;font-weight:900}
/* 曲を作っている間のアニメーション：ボタンがシマシマに流れ、キャンディが速く回り、音符がはねる */
@keyframes stripe{to{background-position:0 0,40px 0}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#play.busy{background-image:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 55%),linear-gradient(-45deg,var(--yellow) 25%,#fff6bf 25%,#fff6bf 50%,var(--yellow) 50%,var(--yellow) 75%,#fff6bf 75%);background-size:100% 100%,40px 40px;animation:stripe .7s linear infinite}
body.making .swirl{animation-duration:1.1s}
#msg .n{display:inline-block;font-size:1.3rem;animation:hop .6s ease-in-out infinite}
#msg .n:nth-child(2){animation-delay:.15s}#msg .n:nth-child(3){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){#play.busy,#msg .n,body.making .swirl{animation:none}}
#msg{font-size:.85rem;color:var(--ink);text-shadow:0 1.5px 0 #fff;font-weight:900;text-align:center;min-height:1.2em}

<script>

// ---- 絵 → 音 ----

function startWorker(my){

// できあがったパートを受けとる。「左→右」が届いたら、すぐ鳴らしはじめる
function accept(r,my){

  if(r.d===0)began(my);
}
// まだ始まっていない予約を取り消す(ループをオフにしたとき)
function cancelFuture(){
  const now=ac.currentTime;

    const s=segs.pop();try{s.src.stop();}catch(e){}nextT=s.t;nextI--;}
}
function stopAll(){

// 曲を作っている間のアニメーション(ボタン・キャンディ・音符)のオン／オフ
function making(on){
  $('play').classList.toggle('busy',on);document.body.classList.toggle('making',on);
  $('msg').innerHTML=on?'<span class="n">♪</span> <span class="n">♫</span> <span class="n">♪</span>':'';
}

function go(){

// お菓子をさわると、種類ごとにちがう動きをする（アプリのトップ画面と同じ）
// s1クッキー=ぷくっ / s2チョコ=ぴょん / s3マカロン=ぷるぷる / s5星クッキー=くるっ / s6ペロペロキャンディ=ゆらゆら
function boing(el){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=+el.dataset.r||0,k=el.dataset.k,j=Math.max(14,el.getBoundingClientRect().width*.5);
  const T=(x,y,a,sx,sy)=>'translate('+x+'px,'+y+'px) rotate('+(r+a)+'deg) scale('+sx+','+sy+')';
  let F,D=650;
  if(k==='s1'){F=[[0,0,0,1,1],[0,0,0,1.5,1.5],[0,0,0,1.4,1.4],[0,0,0,.95,.95],[0,0,0,1,1]];}
  else if(k==='s2'){F=[[0,0,0,1.12,.82],[0,-j,5,.94,1.1],[0,0,-4,1.08,.9],[0,-j*.3,2,.98,1.04],[0,0,0,1,1]];}
  else if(k==='s5'){F=[[0,0,0,1,1],[0,-j,180,1.05,1.05],[0,0,360,1,1]];D=520;}
  else if(k==='s6'){F=[0,16,-14,10,-6,3,0].map(a=>[a*.3,0,a,1,1]);D=900;}
  else{F=[[0,0,0,1,1],[0,0,0,1.28,.72],[0,0,0,.84,1.2],[0,0,0,1.14,.88],[0,0,0,.94,1.07],[0,0,0,1,1]];D=600;}
  if(el._a)el._a.cancel();
  el._a=el.animate(F.map(a=>({transform:T(...a)})),{duration:D,easing:'ease-in-out'});
  pyon();
}
// ぽよんと小さな音。同じ音を、さわるたびに高さ・大きさを少し変えて鳴らす（アプリと同じ考え方）。お菓子とロゴで共通
function pyon(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    const P=[-500,0,200,400,700,900,1200];                 // 高さの候補(セント)。ドレミにあう音。0が元の音
    const c=P.filter(v=>v!==pyon._last);const base=c[Math.floor(Math.random()*c.length)];pyon._last=base;
    const m=Math.pow(2,(base+(Math.random()*30-15))/1200);   // ±15セントのゆらぎ
    const vol=.12*(.75+Math.random()*.25);                   // 大きさは75〜100%
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type='sine';o.frequency.setValueAtTime(520*m,t);o.frequency.exponentialRampToValueAtTime(900*m,t+.09);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);
  }catch(e){}
}
// ロゴ（回転キャンディ）をさわると、棒の下を支点に、だんだん小さくなるふりこのようにゆらゆら（アプリのトップ画面と同じ）
function swayLogo(el){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const head=el.querySelector('.head'),w=(head||el).getBoundingClientRect().width;
  const j=w*34/190,sw=14,base=-5;                              // アプリ：大きさ190ptのとき jump 34・swing 14°
  const amps=[1,-.85,.65,-.45,.3,-.15],durs=[.12,.16,.16,.16,.16,.16];
  const T=(a,y)=>'translateY('+y+'px) rotate('+(base+sw*a)+'deg)';
  const F=[{transform:T(0,0)}],tm=[0];let t=0;
  amps.forEach((a,i)=>{t+=durs[i];F.push({transform:T(a,i===0?-j*.25:0)});tm.push(t);});
  t+=.15;F.push({transform:T(0,0)});tm.push(t);                // さいごに、すっと元の角度へ
  F.forEach((f,i)=>{f.offset=tm[i]/t;f.easing='ease-in-out';});
  if(el._a)el._a.cancel();
  el._a=el.animate(F,{duration:t*1000});
  pyon();
}

// 画面の高さに合わせて、飾りの大きさ(--f)を決める：キャンバスを先にとり、残りをキャンディにあてる
function fit(){
  const cs=getComputedStyle(document.body),vh=window.innerHeight,
    wc=Math.min(window.innerWidth*.94-26,494),
    rest=vh-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-182-wc,
    f=Math.max(.4,Math.min(.65,rest/(1.59*190)));
  document.documentElement.style.setProperty('--f',f.toFixed(3));
  avoid();
}
// 文字（「曲調：…」と「-ongaku-」）にお菓子がかぶらないよう、かぶるお菓子だけを、いちばん近いあいている場所へずらす
function avoid(){
  const deco=document.querySelector('.deco');if(!deco)return;
  const R=[];
  for(const e of [$('info'),document.querySelector('.ongaku')]){
    if(!e||e.offsetParent===null)continue;
    const rg=document.createRange();rg.selectNodeContents(e);
    const b=rg.getBoundingClientRect();if(b.width>0)R.push(b);
  }
  const sw=[...deco.querySelectorAll('svg')];
  sw.forEach(x=>{x.style.marginTop='0px';x.style.marginLeft='0px';});
  if(!R.length)return;
  const pad=8,W=window.innerWidth,H=window.innerHeight;
  const dbPx=(()=>{const t=document.createElement('div');t.style.cssText='position:fixed;top:0;height:var(--DB)';deco.appendChild(t);const h=t.getBoundingClientRect().height;t.remove();return h;})();
  const hit=(b,dx,dy)=>R.some(t=>b.left+dx<t.right+pad&&b.right+dx>t.left-pad&&b.top+dy<t.bottom+pad&&b.bottom+dy>t.top-pad);
  const inside=(b,dx,dy)=>b.left+dx>=0&&b.right+dx<=W&&b.top+dy>=dbPx&&b.bottom+dy<=H;
  // 近い順にならべた「ずらし方」（上下左右ななめ、8pxずつ遠くへ）
  const C=[];
  for(let r=8;r<=200;r+=8)for(let k=0;k<16;k++){const a=k*Math.PI/8;C.push([Math.round(Math.cos(a)*r),Math.round(Math.sin(a)*r)]);}
  sw.forEach(x=>{
    const b=x.getBoundingClientRect();
    if(!hit(b,0,0))return;
    const c=C.find(([dx,dy])=>inside(b,dx,dy)&&!hit(b,dx,dy));
    if(c){x.style.marginLeft=c[0]+'px';x.style.marginTop=c[1]+'px';}
  });
}
